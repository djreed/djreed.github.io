name: Update macro signals

on:
  schedule:
    # Runs weekdays at 12:00 UTC (adjust to taste). Cron is UTC always.
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

# Only one run (scheduled or manual) pushes to master at a time.
concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch signals
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_signals.py

      - name: Analyze signals
        run: python scripts/analyze_signals.py

      - name: Commit updated signals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/signals_raw.json assets/signals.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update signals.json [automated]"
          # master may have moved (concurrent run, or a manual push) since checkout —
          # rebase onto the current tip and retry a few times before giving up.
          # -X ours: this file is machine-generated, so the freshly-fetched data wins.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            git fetch origin master
            git rebase -X ours origin/master
            sleep $((attempt * 3))
          done
          echo "Failed to push after retries." >&2
          exit 1
